<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<script src="script.js"></script>
<script src="cart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<body>
    <div class="container mt-5">

    <h2>Shopping Cart</h2>

    <ul id="cartItems" class="list-group mb-3"></ul>

    <h4 class="mt-3">
        Total Price: $
        <span id="totalPrice">0.00</span>
    </h4>

    <div class="mt-4">

        <a href="product.html" class="btn btn-secondary">Continue Shopping</a>

        <a href="checkout.html" class="btn btn-success ms-2">Checkout</a>

        <button class="btn btn-danger ms-2" onclick="clearCart()">Clear Cart</button>

    </div>

</div>

<script src="cart.js"></script>
</body>
</html>
